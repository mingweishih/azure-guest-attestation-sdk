name: Release

# Builds the `azure-guest-attest` CLI for Linux (static musl) and Windows and
# publishes the binaries + SHA256 checksums to a GitHub Release.
#
# Trigger by pushing a semver tag (e.g. `v0.1.0`) or manually via the Actions
# tab (workflow_dispatch), supplying a tag name to attach assets to.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish assets to (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: azure-guest-attest

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static Linux binary — portable across glibc/Ubuntu versions.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release -p ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Stage artifact + checksum (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          asset="${BIN_NAME}-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" "dist/${asset}"
          ( cd dist && sha256sum "${asset}" > "${asset}.sha256" )

      - name: Stage artifact + checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "$env:BIN_NAME-${{ matrix.target }}${{ matrix.ext }}"
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME${{ matrix.ext }}" "dist/$asset"
          (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower() + "  $asset" |
            Out-File -Encoding ascii "dist/$asset.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*
          fail_on_unmatched_files: true
