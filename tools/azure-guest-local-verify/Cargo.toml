[package]
name = "azure-guest-local-verify"
version = "0.1.0"
description = "CLI for local (offline) verification of Azure CVM attestation evidence"

edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true

# Local verification requires the SDK `verify` feature, which implies the
# `native` (OpenSSL) backend and is currently Linux-only. Gate the dependency to
# Linux so `cargo build --workspace` stays green on other platforms; the binary
# reports "Linux only" elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
azure-guest-attestation-sdk = { path = "../../crates/azure-guest-attestation-sdk", version = "0.1.0", default-features = false, features = ["verify"] }
clap.workspace = true

[lints]
workspace = true
